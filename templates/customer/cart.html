{% extends "base.html" %}
{% block content %}
<h1>Your Cart</h1>

{% for item in items %}
<div class="card">
    <img src="/static/images/{{item.image}}" alt="image">
    <h2>{{item.name}}</h2>
    <p>₹{{item.price}}</p>
    <p>Quantity: {{item.quantity}}</p>
    <p>Subtotal: ₹{{item.subtotal}}</p>
</div>

<h2>₹{{item.total}}</h2>
<a href="/checkout">Checkout</a>

{% endblock %}
