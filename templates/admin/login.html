{% extends "base.html" %}

{% block title %}
Admin Login
{% endblock %}

{% block content %}

<div class="login-box">
    <h2>Admin Login</h2>

    <form action="admin-login" method="post">
        <input type="email" name="email" placeholder="E-mail">
        <input type="password" name="password" placeholder="Password">
        <button>Login</button>
    </form>
</div>
{% endblock %}
